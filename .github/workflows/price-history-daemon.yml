name: Price history daemon

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/price-history-daemon.yml"
      - ".github/scripts/capture-price-history.mjs"
  workflow_dispatch:

concurrency:
  group: price-history-daemon
  # The successor waits for this run to finish. Cancelling the active run here
  # can interrupt its own restart request and leave collection stopped.
  cancel-in-progress: false

permissions:
  actions: write
  contents: read

jobs:
  daemon:
    runs-on: ubuntu-latest
    # Leave ample room for the restart step before GitHub's runner limit.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Capture every 15 minutes
        env:
          PRICE_HISTORY_URL: https://www.ensarsarraf.com/api/capture_price_history.php
          PRICE_HISTORY_WRITE_KEY: ${{ secrets.PRICE_HISTORY_WRITE_KEY }}
        run: |
          for i in $(seq 1 20); do
            # Recalculate on every cycle so captures stay on :00, :15, :30,
            # and :45 even if a prior request took longer than expected.
            now=$(date -u +%s)
            seconds_to_quarter=$(( (900 - (now % 900)) % 900 ))
            if [ "$seconds_to_quarter" -gt 0 ]; then
              sleep "$seconds_to_quarter"
            fi
            echo "Capture cycle $i / 20"
            timeout 90s node .github/scripts/capture-price-history.mjs
          done

      - name: Restart daemon
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/price-history-daemon.yml/dispatches \
            -d '{"ref":"main"}'
